[project]
name = "unstruwwel-py"
version = "0.1.0"
description = "Detect and parse historic dates, e.g. to ISO 8601:2-2019."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [
    { name = "Stefanie Schneider", email = "stefanie.schneider@itg.uni-muenchen.de" },
    { name = "Kristbaum" },
]
keywords = ["dates", "iso-8601", "history", "parsing", "midas"]
dependencies = ["regex>=2023.0.0"]

[project.urls]
Homepage = "https://github.com/stefanieschneider/unstruwwel"
Issues = "https://github.com/stefanieschneider/unstruwwel/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unstruwwel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
