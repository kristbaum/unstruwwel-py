[project]
name = "unstruwwel"
dynamic = ["version"]
description = "Detect and parse historic dates, e.g. to ISO 8601:2-2019."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.9"
authors = [{ name = "Kristbaum" }, { name = "Stefanie Schneider" }]
keywords = ["dates", "iso-8601", "history", "parsing", "midas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["regex>=2023.0.0"]

[project.urls]
Homepage = "https://github.com/kristbaum/unstruwwel-py"
Repository = "https://github.com/kristbaum/unstruwwel-py"
Issues = "https://github.com/kristbaum/unstruwwel-py/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/unstruwwel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unstruwwel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
